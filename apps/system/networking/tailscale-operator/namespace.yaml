apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  # privileged: the operator's proxy pods (ProxyGroup gateway-ingress) run a
  # privileged init container that enables IP forwarding via sysctl. Talos
  # enforces `baseline` on unlabelled namespaces, which would reject them.
  labels:
    pod-security.kubernetes.io/enforce: privileged

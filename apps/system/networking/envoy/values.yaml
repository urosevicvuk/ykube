# Envoy Gateway runs the data-plane Envoy as ordinary pods (not host network,
# not via Cilium's L7LB BPF redirect), bypassing the return-path identity bug
# that broke Cilium Gateway API on the single-node k3s cluster.
# See Cilium issues #35559, #36004, #42325.
#
# Two controller replicas; they lease-elect a leader via the apiserver and the
# standby takes over if the leader's node goes away. Data-plane
# replica counts live in gateway-*/envoyproxy.yaml.
deployment:
  replicas: 2

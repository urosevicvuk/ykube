# Cilium L2 announcement policy.
# Tells Cilium to ARP-announce LB IPs on the nodes' LAN uplink interface.
# Without this the LB IPs are assigned but unreachable from the LAN.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  namespace: kube-system
spec:
  # Empty selector → applies to every Service of type=LoadBalancer.
  serviceSelector:
    matchLabels: {}
  # Workers only. Controlplanes keep their NoSchedule taint and run no
  # workload pods; announcing from them would just add ARP churn on the LAN.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  # The 1G LAN uplink only (Proxmox net0 → ens18 in Talos; see
  # seed/talos/02-proxmox-provision). Never the mesh (ens19): LAN clients
  # can't reach it, so an IP announced there would be a black hole. Also
  # never tailscale0, cilium_host or the lxc* veths.
  interfaces:
    - ^ens18$
  externalIPs: true
  loadBalancerIPs: true

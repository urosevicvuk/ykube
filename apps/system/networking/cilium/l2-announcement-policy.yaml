# Cilium L2 announcement policy.
# Tells Cilium to ARP-announce LB IPs on the nodes' LAN uplink interface.
# Without this the LB IPs are assigned but unreachable from the LAN.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
  namespace: kube-system
spec:
  # Empty selector → applies to every Service of type=LoadBalancer.
  serviceSelector:
    matchLabels: {}
  # No nodeSelector: every node is control plane + worker, so any of the three
  # may announce. Cilium elects one announcer per Service through a Lease and
  # moves it if that node goes down.
  #
  # The 1G LAN uplink only (`lan0`, renamed by ynix). Never the mesh (`mesh0`):
  # LAN clients can't reach it, so an IP announced there would be a black hole.
  # Also never tailscale0, cilium_host or the lxc* veths.
  interfaces:
    - ^lan0$
  externalIPs: true
  loadBalancerIPs: true

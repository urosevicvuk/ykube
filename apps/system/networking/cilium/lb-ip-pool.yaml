# Cilium LoadBalancer IP pool.
# These IPs get handed out to Services of type=LoadBalancer and ARP-announced
# on the workers' LAN uplink (l2-announcement-policy.yaml).
#
# LAN is 192.168.1.0/24, router = .1. The pool is the static range .2-.9 —
# 8 IPs, plenty for the 2-3 LoadBalancer services this cluster owns. Most
# ingress doesn't use it at all: cloudflared and the tailscale proxies dial
# out, and gateway-internal is tailscale's LB class, not Cilium's.
#
# Keep the pool outside the router's DHCP scope. The Talos VMs' LAN IPs (9
# nodes) are DHCP reservations by MAC, and the Talos API VIP is a static IP
# that must ALSO sit outside both the DHCP scope and this pool. If you need
# more room, shrink DHCP to e.g. .50-.200 and grow this pool to .201-.254.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
  namespace: kube-system
spec:
  blocks:
    - start: 192.168.1.2
      stop: 192.168.1.9

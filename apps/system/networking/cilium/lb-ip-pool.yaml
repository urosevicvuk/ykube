# Cilium LoadBalancer IP pool.
# These IPs get handed out to Services of type=LoadBalancer.
#
# firelink LAN is 192.168.1.0/24 (ISP change 2026-09-18 moved it off
# 192.168.0.0/24). Router/gateway = .1, node = .84 via DHCP. The usable
# static range is .2-.9 — 8 IPs, plenty for the 2-3 LoadBalancer services
# this cluster owns (envoy-external, envoy-internal, future
# cilium-gateway-internal if migrated).
#
# NOTE: the node's own address is a DHCP lease, so it can move again. Keep
# a reservation for eno1's MAC on the router pinning it to .84, and keep
# this pool outside the router's DHCP scope.
#
# When moving to Talos+3VMs, also shrink the router's DHCP scope to
# something like .50-.200 and expand this pool to .201-.254 for headroom.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
  namespace: kube-system
spec:
  blocks:
    - start: 192.168.1.2
      stop: 192.168.1.9

# Forgejo Helm values. Vanilla operational deploy: admin user from Vault,
# Postgres from CNPG, repos on Longhorn. HTTPS push/pull via the Gateway.
# SSH disabled (TCP needs the VPS+WG frontend — separate task).

# NO BUNDLED REDIS ANY MORE (chart 12 -> 17, 2026-09-22).
#
# Chart 17.1.7 dropped the bundled cache sub-chart entirely: its Chart.yaml
# declares exactly one dependency (`common`), and the word "redis" does not
# appear anywhere in the chart's values.yaml. The old `redis:` /
# `redis-cluster:` blocks here became dead config — silently ignored, nothing
# deployed — while gitea.config still pointed cache/session/queue at
# `forgejo-redis-master`. Result: Forgejo started fine, then every
# `/api/healthz` returned 424 Failed Dependency on
# `lookup forgejo-redis-master: no such host`, readiness never passed and the
# Deployment sat at 0/1 indefinitely (it was NOT crashlooping, which is why it
# looked healthy from the outside).
#
# With one replica, Forgejo's own defaults are the right answer and remove the
# dependency altogether: in-process cache, sessions in the Postgres we already
# run, and the queue on the Longhorn volume we already mount. The whole
# Bitnami/bitnamilegacy workaround that used to live here died with the
# sub-chart, so it's gone too.
#
# If a real cache is ever wanted, this cluster already runs
# dragonfly-operator (apps/system/storage/dragonfly-operator) — point
# cache/session/queue at a Dragonfly instance rather than reviving a
# sub-chart the upstream chart no longer ships.

# Use CNPG cluster instead of the in-chart Postgres.
postgresql:
  enabled: false

postgresql-ha:
  enabled: false

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi
  accessModes: [ReadWriteOnce]

gitea:
  admin:
    existingSecret: forgejo-admin

  # DB password from CNPG-generated secret (forgejo-pg-app).
  additionalConfigFromEnvs:
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-pg-app
          key: password

  config:
    server:
      DOMAIN: git.urosevicvuk.dev
      ROOT_URL: https://git.urosevicvuk.dev
      DISABLE_SSH: true
      OFFLINE_MODE: false
    database:
      DB_TYPE: postgres
      HOST: forgejo-pg-rw.forgejo:5432
      NAME: forgejo
      USER: forgejo
    # All three used to point at the chart's bundled redis, which chart 17 no
    # longer ships (see the note at the top of this file).
    cache:
      ENABLED: true
      ADAPTER: memory
    session:
      # db, not memory: sessions live in the CNPG Postgres we already run, so
      # a restart doesn't log everyone out.
      PROVIDER: db
    queue:
      # LevelDB on the Longhorn volume mounted at persistence.
      TYPE: level
    service:
      DISABLE_REGISTRATION: true   # admin invites only — multi-tenant hygiene

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

# Don't deploy ingress; Gateway API HTTPRoute does the work.
ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

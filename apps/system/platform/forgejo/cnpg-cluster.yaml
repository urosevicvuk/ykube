# CloudNative-PG Cluster for Forgejo's database.
# CNPG generates the app user secret automatically (forgejo-pg-app); Forgejo
# reads it via Helm values (existing database settings below).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-pg
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  # Primary + one streaming replica, required to sit on a different physical
  # host. The operator promotes the replica if the primary's host dies.
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 10Gi
    storageClass: ceph-block-ssd
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true

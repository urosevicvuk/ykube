# Postgres for Argo Workflows run-history archive. Generates the secret
# `argo-workflows-pg-app` with discrete `username` / `password` keys — the
# chart wires these via userNameSecret/passwordSecret in values.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: argo-workflows-pg
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  # Primary + one streaming replica, required to sit on a different Proxmox
  # host. The operator promotes the replica if the primary's host dies.
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 5Gi
    storageClass: ceph-block-2x
  bootstrap:
    initdb:
      database: argo_workflows
      owner: argo_workflows
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  monitoring:
    enablePodMonitor: true

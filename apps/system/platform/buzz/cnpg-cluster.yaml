# CloudNative-PG Cluster for Buzz.
#
# Holds the event log — messages, channels, workflows, audit chain and the
# full-text search index. This is the half of Buzz that stays on our disks; git
# objects and media live in the object store.
#
# Unlike Forgejo, the app user password is NOT left to CNPG's autogenerated
# `-app` secret. Buzz wants a single flat DATABASE_URL, which secrets.yaml
# composes from Vault, so both sides must agree on one password — hence
# bootstrap.initdb.secret pointing at the ESO-managed basic-auth secret.
#
# Schema migrations are embedded in the relay binary (sqlx::migrate!) and run at
# startup under BUZZ_AUTO_MIGRATE, race-safe behind a Postgres advisory lock.
# No migration Job is needed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: buzz-pg
  namespace: buzz
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 20Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: buzz
      owner: buzz
      secret:
        name: buzz-pg-creds
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true

# Buzz — self-hosted Nostr workspace: chat + git forge, humans and AI agents as
# equal signing identities.
#
# Sits alongside forgejo/harbor. Forgejo is NOT replaced: it keeps git on a
# local PVC, whereas Buzz's forge is object-store-backed. Buzz is v0.2.1 and
# Block describe its forge UI as early-stage, so leaving real repos on Forgejo
# until this proves itself is the intended posture.
#
# Agents are deliberately absent from this repo entirely. The Buzz Desktop app
# is the launcher: its `buzz-backend-kubernetes` provider runs on the operator's
# machine, prefills a freshly generated `buzz-agents-<rand6>` namespace on every
# `info` call, CREATES that namespace itself, and deploys `sprig` pods into it
# using the operator's own kubeconfig. Pre-declaring a namespace in git would be
# ignored by that default and fight the design (docs/remote-agents.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buzz

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - redis.yaml
  - secrets.yaml
  - bucket-job.yaml
  - httproute-pairing.yaml
  - backendtrafficpolicy.yaml

helmCharts:
  - name: buzz
    # Full OCI path split into repo + name. The `path: .` workaround in the
    # chart's own examples/argocd-app.yaml applies to Argo CD's NATIVE Helm
    # source resolution, which ignores `chart:` for oci:// URLs. We inflate via
    # kustomize (helm pull), which handles the split correctly.
    repo: oci://ghcr.io/block/buzz/charts
    version: 0.1.7  # renovate: depName=block/buzz
    releaseName: buzz
    namespace: buzz
    valuesFile: values.yaml

# Repair large-integer env vars mangled by the Helm inflator.
#
# kustomize v5.8.1 merges the chart's own defaults into the values file it
# passes to `helm template`, and its YAML round-trip re-serialises large
# integers in float notation. Two of the relay's byte-size env vars come out as
# "9.961472e+07" and "5.36870912e+09", which the relay cannot parse as integers
# — it would fail at startup. This affects the chart's untouched defaults, not
# just values we set, so it cannot be avoided by leaving the keys alone. The
# values.schema.json types them as `integer`, so they also cannot be quoted into
# strings in values.yaml.
#
# Env var values are plain strings in the Pod spec, so re-asserting them after
# rendering is lossless. This is the single source of truth for both limits.
#
#   BUZZ_GIT_MAX_PACK_BYTES        95 MiB. Chart default is 500 MiB, but Buzz is
#                                  reached through the Cloudflare tunnel, whose
#                                  free plan caps request bodies at 100 MB. A
#                                  bigger push would fail at the edge with an
#                                  opaque Cloudflare error rather than a legible
#                                  Buzz one.
#   BUZZ_GIT_PACK_CACHE_MAX_BYTES  5 GiB — the chart's own default, restored.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: buzz
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: buzz
      spec:
        template:
          spec:
            containers:
              - name: relay
                env:
                  - name: BUZZ_GIT_MAX_PACK_BYTES
                    value: "99614720"
                  - name: BUZZ_GIT_PACK_CACHE_MAX_BYTES
                    value: "5368709120"

  # Recreate instead of the chart's RollingUpdate(maxSurge:1, maxUnavailable:0).
  #
  # The relay mounts a ReadWriteOnce PVC for its git working area. RollingUpdate
  # starts the replacement Pod before the old one terminates, so both hold the
  # same RWO volume at once. That happens to work today only because firelink is
  # a single node and RWO scopes to a node, not a Pod — the moment a second node
  # exists, the new Pod would wedge in Pending on multi-attach and the rollout
  # would stall.
  #
  # At replicaCount 1 there is no availability to preserve during a rollout
  # anyway, so Recreate costs nothing and removes the latent trap.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: buzz
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: buzz
      spec:
        strategy:
          $patch: replace
          type: Recreate

# Stamp recommended k8s labels on every rendered resource.
# Uses `labels:` (not deprecated `commonLabels:`) with includeSelectors=false so
# selector matchLabels are untouched — required because Deployment selectors are
# immutable post-creation.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: system
      app.kubernetes.io/managed-by: argocd

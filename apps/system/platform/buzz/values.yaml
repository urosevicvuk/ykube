# Buzz relay — Nostr-based workspace: chat + built-in git forge.
#
# One binary serves WebSocket, REST, the web UI, the admin UI and the git forge
# at /git/*. There is no service fleet here; buzz-admin and buzz-pair-relay ship
# in the same image.

image:
  # MUST be pinned. The chart declares appVersion "0.1.0" and image.tag defaults
  # to it, but chart and relay release from independent tag series (chart-v* vs
  # relay-v*) and CI does not rewrite appVersion at publish. Leaving this empty
  # deploys a two-minor-versions-stale relay.
  #
  # Published relay semver tags as of 2026-08-12: 0.1.0, 0.1.1, 0.2.0, 0.2.1.
  # The repo's v0.5.x GitHub releases are the DESKTOP app and have no matching
  # relay image — do not pin to them.
  tag: "0.2.1"  # renovate: datasource=docker depName=ghcr.io/block/buzz

replicaCount: 1

relayUrl: wss://buzz.urosevicvuk.dev

# The operator's personal Nostr pubkey (64-char lowercase hex) — the human admin
# account, NOT the relay's machine identity (that lives in Vault as
# BUZZ_RELAY_PRIVATE_KEY). Required because relay.requireRelayMembership
# defaults to true.
#
# This is a PUBLIC key; it is safe in git. The matching private key must never
# be committed — it is the only way to authenticate as admin and cannot be
# reset or recovered.
ownerPubkey: "c1b10321fc77672348537b3105eba756b56f235fec2e132944f59f7c7316dcc4"

secrets:
  # GitOps-safe path. The chart's own randAlphaNum/lookup autogeneration is only
  # correct under `helm install`; under `helm template` (which both Argo and
  # kustomize use) lookup returns empty and secrets would regenerate every sync.
  existingSecret: buzz-secrets

# All bundled eval services off — this is the production profile.
# minio.enabled=true additionally hard-fails when combined with existingSecret.
postgresql: { enabled: false }
redis:      { enabled: false }
minio:      { enabled: false }

# Left empty on purpose: DATABASE_URL is supplied through buzz-secrets so the
# password never appears in values. Setting both would be ambiguous.
externalPostgresql: { url: "" }
# Redis is only required at replicaCount > 1 (buzz-pubsub fan-out). At one
# replica fan-out is in-process.
externalRedis: { url: "" }

s3:
  # In-cluster AIStor. Plain HTTP because the object store runs with
  # disableAutoCert — see apps/system/storage/aistor/objectstore-values.yaml.
  #
  # Port 80, NOT 9000. The operator owns this Service and publishes
  # `port=80 targetPort=9000 name=http-minio` — 9000 is the container port, not
  # the Service port. Verified on the live cluster with
  # `kubectl -n aistor get svc s3`.
  endpoint: "http://s3.aistor.svc.cluster.local:80"
  bucket: buzz-media
  #
  # `region` and `addressingStyle` are NOT set here — not an oversight.
  # Chart 0.1.7 ships a values.schema.json whose s3 block allows only
  # {endpoint, bucket, accessKey, secretKey} with additionalProperties: false,
  # so setting either key fails rendering with "additional properties 'region',
  # 'addressingStyle' not allowed" — despite both being documented at length in
  # the chart's own values.yaml and README. Upstream schema bug.
  #
  # Harmless here because the chart's defaults are already what we want:
  #   region          -> ""     (preserves the relay's AWS_REGION fallback)
  #   addressingStyle -> path   (required: MinIO Service DNS resolves one
  #                              hostname, not <bucket>.<service>)
  # If a future chart version fixes the schema, set them explicitly.

persistence:
  git:
    # Scratch only. Git ref/object state is object-store-backed and repo-name
    # uniqueness lives in Postgres, so nothing authoritative is on this volume.
    # A PVC (rather than emptyDir) keeps the working area warm across restarts.
    enabled: true
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 10Gi

# NOTE: `git.maxPackBytes` is deliberately NOT set here.
#
# kustomize v5.8.1 merges the chart's defaults into the values file it hands to
# helm, and its YAML round-trip turns every large integer into float notation —
# 99614720 renders as "9.961472e+07", and even the untouched chart default
# git.packCacheMaxBytes renders as "5.36870912e+09". The relay parses those env
# vars as integers, so both would fail at startup.
#
# Setting the value here cannot work (the schema requires type: integer, so it
# cannot be quoted into a string). Both values are therefore corrected in
# kustomization.yaml's `patches:` block, after rendering, as plain strings.
# See that patch for the intended limits.

httproute:
  # Gateway API rather than the classic ingress (mutually exclusive). The
  # wildcard *.urosevicvuk.dev listener, its cert and cloudflared's wildcard
  # ingress rule already exist — this route is the only networking change.
  enabled: true
  parentRefs:
    - name: gateway-external
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - buzz.urosevicvuk.dev

pairingRelay:
  # Stateless NIP-AB device-pairing relay, same image, its own Deployment and
  # Service. The main relay advertises this URL in its NIP-11 document so
  # clients dial it directly. The chart deliberately creates no route for it —
  # see httproute-pairing.yaml.
  enabled: true
  url: wss://pair.urosevicvuk.dev

relay:
  # Huddle audio is only safe on a single-pod relay until an SFU exists. The
  # chart's null default auto-renders false when replicaCount > 1; setting it
  # explicitly opts in AND opts out of that protection.
  # MUST be set back to null/false before ever scaling past one replica.
  huddleAudioAvailable: true

ingress:
  enabled: false

serviceMonitor:
  # kube-prometheus-stack is present cluster-wide.
  enabled: true

podDisruptionBudget:
  # Chart defaults to minAvailable: 1. On a single-node cluster at
  # replicaCount: 1 that permanently blocks `kubectl drain` and node
  # maintenance. Re-enable alongside replicaCount > 1.
  enabled: false

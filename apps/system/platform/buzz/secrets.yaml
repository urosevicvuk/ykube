# All ExternalSecrets for Buzz. Wave -10 — materialise before CNPG bootstraps
# and before the relay's pods boot.
#
# Vault is the single source of truth:
#   vault kv put -mount=kv buzz/relay    private_key=<64 hex> git_hook_hmac=<32+ chars>
#   vault kv put -mount=kv buzz/postgres password=<ALPHANUMERIC ONLY>
#   vault kv put -mount=kv buzz/s3       access_key_id=<...> secret_access_key=<...>
#
# The Postgres password MUST be alphanumeric. It is interpolated into
# DATABASE_URL below without percent-encoding, so a '@', '/', ':', '#' or '?'
# would silently corrupt the connection string.
---
# Basic-auth credentials consumed by CNPG's bootstrap.initdb.secret so the app
# user's password is one we control (and can therefore also embed in
# DATABASE_URL below). Username is a literal — only the password is a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz-pg-creds
  namespace: buzz
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: buzz-pg-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "buzz"
        password: "{{ .pg_password }}"
  data:
    - secretKey: pg_password
      remoteRef:
        key: buzz/postgres
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# The Secret named by `secrets.existingSecret`. Because creationPolicy: Owner
# truncates the target to exactly what ESO renders, EVERY key the relay reads
# must be templated here — there is no coexistence with chart-side autogen.
#
# BUZZ_GIT_HOOK_HMAC_SECRET is only strictly required at replicaCount > 1, but
# is provisioned now so scaling later is a one-line values change.
#
# BUZZ_RELAY_PRIVATE_KEY is the RELAY's machine identity, not the operator's.
# Rotating it changes who the server is to every client — treat as permanent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz-secrets
  namespace: buzz
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: buzz-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        BUZZ_RELAY_PRIVATE_KEY: "{{ .relay_private_key }}"
        BUZZ_GIT_HOOK_HMAC_SECRET: "{{ .git_hook_hmac }}"
        BUZZ_S3_ACCESS_KEY: "{{ .s3_access_key }}"
        BUZZ_S3_SECRET_KEY: "{{ .s3_secret_key }}"
        DATABASE_URL: "postgres://buzz:{{ .pg_password }}@buzz-pg-rw.buzz.svc.cluster.local:5432/buzz?sslmode=require"
  data:
    - secretKey: relay_private_key
      remoteRef:
        key: buzz/relay
        property: private_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: git_hook_hmac
      remoteRef:
        key: buzz/relay
        property: git_hook_hmac
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: s3_access_key
      remoteRef:
        key: buzz/s3
        property: access_key_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: s3_secret_key
      remoteRef:
        key: buzz/s3
        property: secret_access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: pg_password
      remoteRef:
        key: buzz/postgres
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

# Route for the device-pairing relay.
#
# The Buzz chart renders an HTTPRoute for the main relay (via httproute.* in
# values.yaml) but deliberately creates none for the pairing service — its
# README says to "route the public hostname to <release>-buzz-pairing:5000 with
# your platform's ingress configuration". This is that.
#
# The hostname is advertised to clients in the main relay's NIP-11 document via
# pairingRelay.url, so the two must agree.
#
# No DNS or certificate work is needed: the *.urosevicvuk.dev listener on
# gateway-external, its wildcard cert, and cloudflared's wildcard ingress rule
# already cover this name, and external-dns publishes the CNAME.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: buzz-pairing
  namespace: buzz
spec:
  parentRefs:
    - name: gateway-external
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - pair.urosevicvuk.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: buzz-pairing
          port: 5000
          group: ""
          kind: Service
          weight: 1

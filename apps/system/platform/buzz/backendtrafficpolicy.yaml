# Long-lived WebSocket support for the relay.
#
# Buzz clients hold a persistent WebSocket to the relay for event fan-out;
# Envoy's default idle timeout would cut them and cause reconnect churn.
#
# Scoped to these two routes specifically, NOT applied at the Gateway level — a
# Gateway-wide ClientTrafficPolicy would change idle behaviour for every tenant
# sharing gateway-external (morel, eko-servis, raf, ofnir, homelab).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: buzz-ws
  namespace: buzz
spec:
  targetRefs:
    # The chart names the main route after buzz.fullname; with
    # releaseName: buzz that resolves to `buzz`.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: buzz
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: buzz-pairing
  timeout:
    http:
      connectionIdleTimeout: 1h

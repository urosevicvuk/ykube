# Kyverno policy engine. Policies live in ./policies/ and start in Audit mode
# so the first month of compliance violations surface in PolicyReports without
# blocking workloads. Flip to Enforce after the audit is clean.

# HA per Kyverno's docs: 3 admission replicas (it's in the request path of
# every API write it has webhooks on), 2 of each background controller.
admissionController:
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

backgroundController:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

cleanupController:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

reportsController:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# ServiceMonitor scraped by kube-prometheus-stack.
admissionController.serviceMonitor:
  enabled: true

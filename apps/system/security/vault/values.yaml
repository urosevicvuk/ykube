# Vault, HA with integrated raft storage: 3 replicas, one per Proxmox host.
# TLS terminates at the cluster Gateway; Vault speaks HTTP in-cluster.
# ESO consumes via Kubernetes auth (SA: external-secrets/external-secrets).
#
# Bootstrap: seed/talos/06-vault-init inits vault-0 and unseals all three;
# vault-1/2 join raft on their own via the retry_join blocks below.
# Auto-unseal is not configured — after node reboots run
# `task -d seed/talos vault:status` / `vault:unseal`. Raft keeps serving as
# long as 2 of 3 members are unsealed.

global:
  tlsDisable: true

injector:
  enabled: false

server:
  image:
    repository: hashicorp/vault
    tag: "2.1.1"

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: ceph-block

  # Audit goes to stdout (collected by Alloy → Loki).
  auditStorage:
    enabled: false

  serviceAccount:
    create: true
    name: vault
    serviceAccountToken:
      enabled: true

  # The chart's default anti-affinity is per *hostname*; two workers share each
  # Proxmox host, so that could put 2 of 3 raft members on one machine. Spread
  # by zone (= Proxmox host) instead. Required, not preferred: a raft cluster
  # with two members on one box loses quorum with that box.
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ template "vault.name" . }}
              app.kubernetes.io/instance: "{{ .Release.Name }}"
              component: server
          topologyKey: topology.kubernetes.io/zone

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        # Labels each pod vault-active=true|false via the k8s API, so the
        # `vault-active` Service always points at the leader.
        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

        log_level = "info"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

ui:
  enabled: true
  serviceType: ClusterIP

serverTelemetry:
  serviceMonitor:
    enabled: true
  prometheusRules:
    enabled: false

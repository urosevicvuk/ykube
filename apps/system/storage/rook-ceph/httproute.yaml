# Ceph dashboard, tailnet-only. The mgr serves plain HTTP on 7000 because
# cluster-values.yaml sets dashboard.ssl: false (TLS terminates at the Gateway).
# Login: user `admin`, password in Secret rook-ceph-dashboard-password.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: gateway-internal
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - ceph.urosevicvuk.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rook-ceph-mgr-dashboard
          port: 7000
          group: ""
          kind: Service
          weight: 1

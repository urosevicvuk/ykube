# Rook CephCluster + pools + object store.
#
# Only overrides are listed. Maps deep-merge with the chart defaults; LISTS
# (cephBlockPools, cephFileSystems, cephObjectStores) replace them wholesale,
# which is why the block pools repeat the chart's CSI secret parameters.

# `ceph` CLI in a pod: kubectl -n rook-ceph exec -it deploy/rook-ceph-tools -- ceph status
toolbox:
  enabled: true

# ServiceMonitor for the mgr's Prometheus module + Ceph's alerting rules.
monitoring:
  enabled: true
  createPrometheusRules: true

cephClusterSpec:
  # TLS terminates at the Gateway (httproute.yaml); the mgr serves HTTP on 7000.
  dashboard:
    enabled: true
    ssl: false

  # Host networking, bound to the 25G mesh. Ceph daemons (mons, OSDs, mgrs)
  # listen on the workers' mesh IPs directly instead of on pod IPs, so
  # replication and client I/O run host-to-host at jumbo-frame MTU and skip
  # the Cilium datapath. (Pods are capped at 1500 MTU — Cilium uses the lowest
  # MTU of the node's NICs, and the uplink is 1500.) The CSI/RBD clients
  # already live in the host network namespace, so they talk to the OSDs over
  # the mesh too.
  #
  # CREATE-TIME ONLY: Rook does not support changing the network provider or
  # these ranges on a running cluster. The CIDR must match mesh_cidr in
  # seed/talos/shared/variables.tf.
  network:
    provider: host
    addressRanges:
      public:
        - 10.10.0.0/24
      cluster:
        - 10.10.0.0/24

  # Chart defaults are already 3 mons / 2 mgrs with allowMultiplePerNode: false.
  # That only spreads them across *nodes* — two workers share each Proxmox
  # host, so it could still put 2 of 3 mons on one machine and lose quorum
  # with it. Spread them across zones (= Proxmox hosts) instead.
  placement:
    mon:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: rook-ceph-mon
    mgr:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: rook-ceph-mgr

  # OSDs: every empty SCSI disk on every worker. Those are exactly the
  # physical disks seed/talos/02-proxmox-provision passes through (scsi1.. ->
  # /dev/sdX); the Talos OS disk is virtio (/dev/vda) and never matches.
  # Rook still skips any sdX that carries partitions or a filesystem, so wipe
  # reused disks on the Proxmox host first.
  # Controlplanes keep their NoSchedule taint, so no Ceph daemons land there.
  # Device class (ssd/hdd/nvme) is auto-detected from what the guest sees,
  # which follows the `ssd` flag in secrets.auto.tfvars.
  storage:
    useAllNodes: true
    useAllDevices: false
    deviceFilter: "^sd[a-z]+$"

# Two block tiers. Both put each copy on a different Proxmox host
# (failureDomain: zone = the topology.kubernetes.io/zone node label).
#
#   ceph-block     3 copies, DEFAULT. Survives losing any one host with a
#                  spare copy left. For data that exists nowhere else.
#   ceph-block-2x  2 copies, min_size 1. Survives losing any one host, but
#                  with no spare copy until it's back — lose a second disk on
#                  another host in that window and the data is gone. For data
#                  that is replicated elsewhere (CNPG keeps its own Postgres
#                  replica on another host) or can be regenerated (metrics,
#                  logs, traces, caches, container images). 1/3 cheaper.
#
# Nothing on the 2x tier is the only copy of something you'd mourn. Move a
# PVC between tiers = new PVC + copy; the class is immutable on a PVC.
cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: zone
      replicated:
        size: 3
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters: &rbd-storageclass-parameters
        imageFormat: "2"
        imageFeatures: layering
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-modify-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-modify-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-publish-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-publish-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/fstype: ext4

  - name: ceph-blockpool-2x
    spec:
      failureDomain: zone
      replicated:
        size: 2
      # Keep serving I/O with a single copy while a host is down. With the
      # Ceph default (min_size 2) every 2x volume would freeze whenever any
      # one host is offline — i.e. on every Talos/Proxmox upgrade reboot.
      parameters:
        min_size: "1"
    storageClass:
      enabled: true
      name: ceph-block-2x
      isDefault: false
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters: *rbd-storageclass-parameters

# No CephFS for now — every workload here is fine with RWO block. The chart
# default would run an always-on MDS pair (4Gi each) for nothing. Add a
# filesystem here if something genuinely needs ReadWriteMany.
cephFileSystems: []

# S3 object storage (replaces AIStor). Buckets are declarative: an app ships
# an ObjectBucketClaim with storageClassName: ceph-bucket, and Rook creates
# the bucket plus a Secret (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) and a
# ConfigMap (BUCKET_HOST / BUCKET_NAME / BUCKET_PORT) named after the claim.
# In-cluster endpoint: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
cephObjectStores:
  - name: ceph-objectstore
    spec:
      metadataPool:
        failureDomain: zone
        replicated:
          size: 3
      # Erasure coded 2+1 across the 3 hosts: the same protection level as
      # the 2x tier (any one host can be lost; no spare copy while it's down)
      # at 1.5x raw overhead instead of 2x. Fine for bulk S3; anything
      # irreplaceable that lands in S3 also needs a copy off this cluster.
      dataPool:
        failureDomain: zone
        erasureCoded:
          dataChunks: 2
          codingChunks: 1
        parameters:
          bulk: "true"
      preservePoolsOnDelete: true
      gateway:
        port: 80
        instances: 2
        # RGW stays on the pod network (behind its Service on :80) rather
        # than inheriting the cluster's host networking — nothing gains from
        # it binding a port on the workers.
        hostNetwork: false
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        priorityClassName: system-cluster-critical
    storageClass:
      enabled: true
      name: ceph-bucket
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      parameters:
        region: us-east-1
    ingress:
      enabled: false
    route:
      enabled: false

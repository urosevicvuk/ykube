# AIStor licence. Wave -10 — must exist before the operator starts reconciling
# ObjectStore CRs, otherwise object stores fail to initialise.
#
# Contract comes from the operator chart's NOTES.txt: a Secret named
# `minio-license` holding key `minio.license`. The operator picks it up
# automatically; nothing references it by value.
#
# Vault: `vault kv put -mount=kv aistor/license jwt=<JWT>`
# The JWT is an AIStor Free tier licence from SUBNET (subnet.min.io) — perpetual,
# no expiry, single-node standalone use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-license
  namespace: aistor
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-license
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        minio.license: "{{ .jwt }}"
  data:
    - secretKey: jwt
      remoteRef:
        key: aistor/license
        property: jwt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# Root credentials for the object store. Wave -10 — must exist before the
# operator reconciles the ObjectStore CR, or the StatefulSet has no credentials
# to boot with.
#
# The chart does NOT want discrete keys. It wants a single `config.env` key
# holding shell export statements, which the operator sources into the server
# process. Hence the template below rather than a plain data mapping.
#
# Note: `engine: v2` is deliberately absent — external-secrets.io/v1 removed
# that field (it existed in v1beta1) and the apiserver rejects it with
# `unknown field "spec.target.template.engine"`.
#
# Vault: `vault kv put -mount=kv aistor/root user=aistor-admin password=<pw>`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: objectstore-env-configuration
  namespace: aistor
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: objectstore-env-configuration
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        config.env: |
          export MINIO_ROOT_USER={{ .root_user }}
          export MINIO_ROOT_PASSWORD={{ .root_password }}
  data:
    - secretKey: root_user
      remoteRef:
        key: aistor/root
        property: user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: root_password
      remoteRef:
        key: aistor/root
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

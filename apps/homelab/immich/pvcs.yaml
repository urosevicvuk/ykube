# Library volume — all photos, thumbnails, encoded video, profile images.
# Starts at 50Gi; Ceph RBD supports online expansion (allowVolumeExpansion on
# ceph-block), so raise this number as the library grows. The library is the
# only copy of the photos, so it stays on the 3-copy tier (3 GiB raw per GiB).
# The ML cache below is re-downloadable, so it uses the cheaper 2-copy tier.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 50Gi
---
# Separate cache PVC for the ML server (model files).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block-2x
  resources:
    requests:
      storage: 10Gi

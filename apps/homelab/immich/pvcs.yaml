# Library volume — all photos, thumbnails, encoded video, profile images.
# Starts at 100Gi; Ceph RBD supports online expansion (allowVolumeExpansion on
# ceph-block), so raise this number as the library grows. Each GiB here costs
# 3 GiB of raw Ceph capacity (3 replicas, one per Proxmox host).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 50Gi
---
# Separate cache PVC for the ML server (model files).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 10Gi

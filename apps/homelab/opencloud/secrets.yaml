# OpenCloud's internal service account, surfaced as env so every service gets
# the same one. Wave -10 — materialize before the pod boots.
#
# WHY THIS EXISTS (2026-09-22, opencloud-rolling v7 -> v8): v8 requires a
# `service_account` block under `sharing:` in opencloud.yaml. The config on the
# opencloud-config PVC was written by `opencloud init` back on v7, when sharing
# didn't need one, so it has only `sharing: {events: {tls_insecure: true}}`.
# v8 refuses to start:
#
#   The service account id has not been configured for sharing.
#
# and since `opencloud init` won't overwrite an existing config file, the
# container crashlooped (~16 restarts) with no way out of its own accord.
#
# The account itself is fine — it already exists in the IDM on the data PVC,
# and every other service (proxy, frontend, search, storage_users,
# notifications, ...) is already using it. Checked: all of them reference ONE
# id, so there is no per-service account to disambiguate. The only thing
# missing was the sharing service being told about it.
#
# OC_SERVICE_ACCOUNT_ID / OC_SERVICE_ACCOUNT_SECRET are global overrides that
# apply to every service including sharing, so setting them fixes sharing
# without editing the file on the PVC — and, unlike a hand-patched config,
# survives any future `opencloud init` regenerating that file.
#
# DO NOT invent new values here. The id must match the account that exists in
# the IDM; a fresh one would authenticate against nothing. Populate Vault from
# the values already in the config:
#
#   vault kv put kv/opencloud/service-account \
#     id=@oc-sa-id secret=@oc-sa-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-service-account
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: opencloud-service-account
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OC_SERVICE_ACCOUNT_ID
      remoteRef:
        key: opencloud/service-account
        property: id
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: OC_SERVICE_ACCOUNT_SECRET
      remoteRef:
        key: opencloud/service-account
        property: secret
        conversionStrategy: Default
        decodingStrategy: None

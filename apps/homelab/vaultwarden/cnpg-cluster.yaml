# CloudNative-PG Cluster for Vaultwarden's database.
# CNPG generates `vaultwarden-pg-app` with the `uri` key (full DATABASE_URL),
# consumed by the chart via env from secret (see values.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-pg
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  # Primary + one streaming replica, required to sit on a different Proxmox
  # host. The operator promotes the replica if the primary's host dies.
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  storage:
    size: 5Gi
    storageClass: ceph-block-2x
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  monitoring:
    enablePodMonitor: true

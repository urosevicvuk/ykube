apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: morel
  namespace: argocd
spec:
  generators:
    - git:
        # Manifests live in morelrs/infra, not here: ykube is a public personal
        # repo and this is a company's infrastructure. Credentials for the
        # private repo are in root/morel-infra-repo.yaml — they cannot live in
        # the repo they unlock.
        repoURL: https://github.com/morelrs/infra
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: 'morel-{{path.basename}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: morel
      source:
        repoURL: https://github.com/morelrs/infra
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'morel-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Apps own their Namespace resource.
          - ServerSideApply=true
          - PruneLast=true

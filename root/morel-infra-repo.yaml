# Credentials ArgoCD uses to clone the private `morelrs/infra` repository.
#
# Chicken and egg: this cannot live in the repo it unlocks. `ykube` is public
# and ArgoCD already reads it, so the credential for the private repo lives
# here while the manifests it unlocks live there.
#
# Vault path:
#     vault kv put kv/morel/infra-repo \
#       username=morel-argocd \
#       password=<fine-grained PAT, Contents: read on morelrs/infra>
#
# The `argocd.argoproj.io/secret-type: repository` label is what makes ArgoCD
# pick a Secret up as repo credentials — without it this is an inert Secret and
# every morel Application fails on clone with "repository not found", which
# looks like a missing repo rather than a missing credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: morel-infra-repo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: morel-infra-repo
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/morelrs/infra
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: morel/infra-repo
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        key: morel/infra-repo
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
